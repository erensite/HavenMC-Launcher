name: HavenMC Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.conf.json
      - name: Normalize Windows executable name
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -Recurse | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $exe) { Write-Error 'No Windows EXE was produced'; exit 1 }
          Copy-Item $exe.FullName HavenMC-Launcher.exe
      - uses: actions/upload-artifact@v4
        with: { name: HavenMC-Launcher-Windows, path: HavenMC-Launcher.exe }
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure Android 7+ and device ABIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/variables.gradle')
          s = p.read_text().replace('minSdkVersion = 22', 'minSdkVersion = 24')
          p.write_text(s)
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('targetSdkVersion rootProject.ext.targetSdkVersion\n', "targetSdkVersion rootProject.ext.targetSdkVersion\n        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }\n")
          s = s.replace('    buildTypes {', '''    signingConfigs {
        release {
            storeFile file("../havenmc-ci-release.keystore")
            storePassword "havenmc-ci-store-password"
            keyAlias "havenmc"
            keyPassword "havenmc-ci-key-password"
        }
    }
    buildTypes {''')
          s = s.replace('        release {\n            minifyEnabled false', '        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false')
          p.write_text(s)
          PY
      - name: Create ephemeral release signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore android/havenmc-ci-release.keystore \
            -storepass havenmc-ci-store-password -keypass havenmc-ci-key-password \
            -alias havenmc -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HavenMC, OU=Launcher, O=HavenMC, L=Internet, ST=Internet, C=TR"
      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon clean assembleRelease)
      - name: Verify installable APK
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='live.havenmc.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'24'"
          if unzip -l "$APK" | grep -q ' lib/'; then
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
            unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          else
            echo 'No native libraries: universal Java/WebView APK is ABI-independent and runs on arm64-v8a and armeabi-v7a.'
          fi
          cp "$APK" HavenMC-Launcher.apk
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$(sha256sum HavenMC-Launcher.apk | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with: { name: HavenMC-Launcher-Android, path: HavenMC-Launcher.apk }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/HavenMC-Launcher-Windows/HavenMC-Launcher.exe
            artifacts/HavenMC-Launcher-Android/HavenMC-Launcher.apk
