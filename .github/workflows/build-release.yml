name: HavenMC Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.conf.json
      - name: Normalize Windows executable name
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -Recurse | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $exe) { Write-Error 'No Windows EXE was produced'; exit 1 }
          Copy-Item $exe.FullName HavenMC-Launcher.exe
      - uses: actions/upload-artifact@v4
        with: { name: HavenMC-Launcher-Windows, path: HavenMC-Launcher.exe }
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk HavenMC-Launcher.apk
      - uses: actions/upload-artifact@v4
        with: { name: HavenMC-Launcher-Android, path: HavenMC-Launcher.apk }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/HavenMC-Launcher-Windows/HavenMC-Launcher.exe
            artifacts/HavenMC-Launcher-Android/HavenMC-Launcher.apk
